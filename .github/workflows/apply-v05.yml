name: Apply Folio v0.5 source

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply prepared v0.5 tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf scripts/folio-v05-payload.tar.gz
          rm -f folio-beta-base64.txt
          rm -f COMPILE_FIX_VERIFICATION.txt
          rm -f UPDATE_v0.2.0.md UPDATE_v0.3.0.md UPDATE_v0.4.0.md
          rm -f scripts/folio-v05-payload.tar.gz
          rm -f .github/workflows/apply-v05.yml
          python3 scripts/validate_release.py

      - name: Commit v0.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Port Folio web features to Android v0.5.0.beta"
          git push origin HEAD:main
