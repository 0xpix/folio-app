name: Tag Folio v0.5.1.beta

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

jobs:
  tag_release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.5.1.beta
      RELEASE_SHA: 4a5b174d29a035e4a513181f70b1506d90fd687d
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_TAG already exists"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch release workflow at tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref "$RELEASE_TAG"
