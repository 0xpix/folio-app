name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - "v*.beta*"
      - "v*-beta*"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Static validation
        run: python3 scripts/validate_release.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Test and compile beta and Play debug variants
        run: gradle :app:testBetaDebugUnitTest :app:testPlayDebugUnitTest :app:assembleBetaDebug :app:assemblePlayDebug --no-daemon --stacktrace

      - name: Upload beta debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: folio-beta-debug
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
          if-no-files-found: error

  beta_release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, 'beta')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 / API 37 SDK
        run: sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.FOLIO_BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FOLIO_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLIO_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOLIO_BETA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore beta keystore
        env:
          KEYSTORE: ${{ secrets.FOLIO_BETA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/folio-beta.jks"
          chmod 600 "$RUNNER_TEMP/folio-beta.jks"

      - name: Verify beta keystore alias
        env:
          STORE_PASSWORD: ${{ secrets.FOLIO_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLIO_BETA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/folio-beta.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1

      - name: Build signed beta APK
        env:
          FOLIO_KEYSTORE_FILE: ${{ runner.temp }}/folio-beta.jks
          FOLIO_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_BETA_KEYSTORE_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_BETA_KEY_ALIAS }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_BETA_KEY_PASSWORD }}
          FOLIO_VERSION_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          export FOLIO_VERSION_NAME="${FOLIO_VERSION_NAME#v}"
          gradle :app:assembleBetaRelease --no-daemon --stacktrace

      - name: Verify beta APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/beta/release/app-beta-release.apk

      - name: Verify beta APK version matches tag
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          BADGING="$($AAPT dump badging app/build/outputs/apk/beta/release/app-beta-release.apk | head -n 1)"
          python3 - "$GITHUB_REF_NAME" "$BADGING" <<'PY'
          import re
          import sys

          expected = sys.argv[1].removeprefix("v")
          match = re.search(r"versionName='([^']+)'", sys.argv[2])
          if not match:
              raise SystemExit("Could not read APK versionName")
          actual = match.group(1)
          if actual != expected:
              raise SystemExit(f"Tag/APK versionName mismatch: tag={expected}, apk={actual}")
          print(f"Verified versionName {actual}")
          PY

      - name: Prepare beta APK and checksum
        id: beta
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="folio-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/beta/release/app-beta-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload beta artifact
        uses: actions/upload-artifact@v7
        with:
          name: folio-beta-release
          path: |
            ${{ steps.beta.outputs.apk }}
            ${{ steps.beta.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Prepare changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1].removeprefix("v")
          output = Path(sys.argv[2])
          text = Path("CHANGELOG.md").read_text()
          pattern = rf"(?ms)^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, text)
          if not match:
              raise SystemExit(f"Could not find changelog section for {version}")
          output.write_text(match.group(0).strip() + "\n")
          PY

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.beta.outputs.apk }}" \
            "${{ steps.beta.outputs.apk }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Folio $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove restored beta keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/folio-beta.jks"
