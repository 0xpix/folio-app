name: Clean stale Folio branches

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.7.4.beta
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for green main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            row="$(gh api "repos/$REPO/actions/workflows/build-apk.yml/runs?head_sha=$MAIN_SHA&event=push&per_page=10" \
              --jq '.workflow_runs[0] | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            status="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Main CI is green."
                exit 0
              fi
              echo "Main CI completed with: $conclusion"
              exit 1
            fi
            echo "Waiting for main CI... ($attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for main CI"
          exit 1

      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded" || true
          done

      - name: Remove this one-shot workflow
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/cleanup-stale-branches.yml
          git commit -m "Remove one-shot branch cleanup workflow"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag clean v0.7.4.beta tree
        env:
          CLEAN_SHA: ${{ steps.clean.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists"
          else
            git tag "$RELEASE_TAG" "$CLEAN_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Dispatch signed beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-apk.yml --ref "$RELEASE_TAG"
